[workspace]
members = ["app", "domain", "infrastructure"]
default-members = ["app"]
resolver = "3"

[workspace.package]
version = "1.6.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
stet-domain = { path = "domain" }
stet-infrastructure = { path = "infrastructure" }
gtk4 = { version = "0.11.5", features = ["v4_18"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
sourceview5 = { version = "0.11.2", features = ["v5_18"] }
gio = { version = "0.22.10", features = ["v2_80"] }
glib-unix = "0.22.8"
async-channel = "2.5"
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
thiserror = "2"
memchr = "2.8"
encoding_rs = "0.8.42"
chardetng = "1.0"
rustix = { version = "1.1.5", features = ["fs"] }
imara-diff = { version = "0.2.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.26", features = ["v7"] }
fs4 = "1.1"
quick-xml = "0.42"
roxmltree = "0.21"
toml = { version = "1.1", default-features = false, features = ["std", "parse"] }
unicode-segmentation = "1.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27"
proptest = "1.11"
insta = { version = "1.48", features = ["json"] }
pcre2 = "0.2.11"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-pcre2 = "0.1.10"
grep-matcher = "0.1.9"
ignore = "0.4.33"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
borrow_as_ptr = "warn"
case_sensitive_file_extension_comparisons = "warn"
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
default_trait_access = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
format_collect = "warn"
format_push_string = "warn"
if_not_else = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
needless_continue = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
or_fun_call = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
range_plus_one = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
ref_option = "warn"
return_self_not_must_use = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_self = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
