[workspace]
members = ["app", "domain", "infrastructure", "spikes"]
default-members = ["app"]
resolver = "3"

[workspace.package]
version = "1.3.4"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
stet-domain = { path = "domain" }
stet-infrastructure = { path = "infrastructure" }
gtk4 = { version = "0.11.5", features = ["v4_18"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
sourceview5 = { version = "0.11.2", features = ["v5_18"] }
gio = { version = "0.22.10", features = ["v2_80"] }
glib-unix = "0.22.8"
async-channel = "2.5"
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
anyhow = "1"
thiserror = "2"
memchr = "2.8"
encoding_rs = "0.8.42"
chardetng = "1.0"
rustix = { version = "1.1.5", features = ["fs"] }
imara-diff = { version = "0.2.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.26", features = ["v7"] }
fs4 = "1.1"
quick-xml = "0.42"
roxmltree = "0.21"
toml = { version = "1.1", default-features = false, features = ["std", "parse"] }
unicode-segmentation = "1.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27"
proptest = "1.11"
insta = { version = "1.48", features = ["json"] }
pcre2 = "0.2.11"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-pcre2 = "0.1.10"
grep-matcher = "0.1.9"
ignore = "0.4.33"
crossbeam-channel = "0.5.17"

[profile.release]
lto = "thin"
codegen-units = 1
