[package]
name = "stet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "stet"
path = "src/main.rs"

[features]
# The self-test interpreter (`stet --self-test`, ADR-020). Release packages are built without it.
default = ["selftest"]
selftest = ["dep:serde_json"]

[dependencies]
stet-domain.workspace = true
stet-infrastructure.workspace = true
gtk4.workspace = true
libadwaita.workspace = true
sourceview5.workspace = true
gio.workspace = true
glib-unix.workspace = true
async-channel.workspace = true
clap.workspace = true
serde_json = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
